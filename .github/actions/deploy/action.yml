name: "Deploy to Environment"
description: "Runs deploy-setup, packages the WebApp Docker image, and deploys the ECS service."

inputs:
  service_name:
    description: "Identifier used for both the image name and ECS service name."
    required: true

  stage:
    description: "Stage to deploy to"
    required: true

runs:
  using: "composite"
  steps:
    - name: Deploy Setup
      uses: ./.github/actions/deploy-setup
      with:
        stage: ${{ env.STAGE }}
    - name: Package WebApp Docker Image
      uses: ./.github/actions/package-webapp-docker
      with:
        image-name: ${{ inputs.service_name }}

    - name: Deploy WebApp to ECS
      shell: bash
      run: |
        aws ecs update-service --cluster bfs_container_cluster \
          --service ${{ inputs.service_name }} --region "$AWS_REGION" \
          --force-new-deployment

    - name: Verify Staging ECS Deployment
      if: ${{ inputs.stage == 'staging' }}
      shell: bash
      run: |
        if aws ecs wait services-stable --cluster bfs_container_cluster \
          --services ${{ inputs.service_name }} --region "$AWS_REGION"; then
          echo "ECS service reached a stable state."
          exit 0
        fi

        echo "ECS service did not reach a stable state." >&2
        aws ecs describe-services --cluster bfs_container_cluster \
          --services ${{ inputs.service_name }} --region "$AWS_REGION" \
          --query 'services[0].{
            status:status,
            desiredCount:desiredCount,
            runningCount:runningCount,
            pendingCount:pendingCount,
            deployments:deployments[*].{
              id:id,
              status:status,
              rolloutState:rolloutState,
              rolloutStateReason:rolloutStateReason,
              desiredCount:desiredCount,
              runningCount:runningCount,
              pendingCount:pendingCount,
              failedTasks:failedTasks
            },
            recentEvents:events[0:10]
          }'
        exit 1
