name: "Generate Release Notes"
description: "Runs semantic-release and creates a pull request to main."

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

    - name: Generate Release Notes
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        pnpm exec semantic-release --branches "$GITHUB_REF_NAME"

    - name: Create PR to main
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git status
        git fetch origin main:refs/remotes/origin/main
        gh pr create --fill --base main --head "$GITHUB_REF_NAME"
