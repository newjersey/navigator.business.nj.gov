name: "Code Quality Checks"
description:
  "Runs typecheck, prettier, linting, spellcheck, dependency checks, and Storybook build."

runs:
  using: "composite"
  steps:
    - name: Validate Dependency Policy
      shell: bash
      run: |
        pnpm test:dependency-policy

    - name: Run Typecheck
      shell: bash
      run: |
        pnpm typecheck

    - name: Run Cypress Typecheck
      shell: bash
      run: |
        pnpm --filter @businessnjgovnavigator/web run typecheck:cypress

    - name: Run Prettier
      shell: bash
      run: |
        pnpm prettier:check

    - name: Run Linting
      shell: bash
      run: |
        pnpm lint

    - name: Run Spell Checker
      shell: bash
      run: |
        pnpm run spellcheck

    - name: Run Dependency Check
      shell: bash
      run: |
        pnpm dependency-check

    - name: Build Storybook
      shell: bash
      run: |
        pnpm --filter @businessnjgovnavigator/web run build-storybook
