name: "Code Quality Checks"
description: "Runs typecheck, formatting and lint checks, spellcheck, dependency checks, and Storybook build."

runs:
  using: "composite"
  steps:
    - name: Validate Dependency Policy
      shell: bash
      run: |
        pnpm run test:dependency-policy

    - name: Test Node Updater
      shell: bash
      run: |
        pnpm run test:node-updater

    - name: Run Typecheck
      shell: bash
      run: |
        pnpm run typecheck

    - name: Run Cypress Typecheck
      shell: bash
      run: |
        pnpm --filter @businessnjgovnavigator/web run typecheck:cypress

    - name: Check Formatting
      shell: bash
      run: |
        pnpm run format:check

    - name: Run Biome
      shell: bash
      run: |
        pnpm exec biome ci --error-on-warnings .

    - name: Run Spell Checker
      shell: bash
      run: |
        pnpm run spellcheck

    - name: Run Dependency Check
      shell: bash
      run: |
        pnpm run dependency-check

    - name: Build Storybook
      shell: bash
      run: |
        pnpm --filter @businessnjgovnavigator/web run build-storybook
