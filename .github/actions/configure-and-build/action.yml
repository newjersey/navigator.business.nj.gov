name: Configure and Build
description: Runs bootstrap-code and builds the project
inputs:
  ref:
    description: "Git ref to check out. Defaults to the caller's ref."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}

    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: package.json
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Determine Cypress Version
      shell: bash
      run: |
        node -p "require('./package.json').devDependencies.cypress" > cypress.lock

    - name: Restore Cypress Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/Cypress
        key: cypress-cache-${{ hashFiles('cypress.lock') }}
        restore-keys: |
          cypress-cache-

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Verify Cypress Installation
      shell: bash
      run: pnpm exec cypress install

    - name: Build Application
      shell: bash
      run: pnpm run build
