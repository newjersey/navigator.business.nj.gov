name: Configure and Build
description: Runs bootstrap-code and builds the project
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: yarn

    - name: Determine Cypress Version
      shell: bash
      run: |
        node -p "require('./package.json').devDependencies.cypress" > cypress.lock

    - name: Restore Cypress Cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/Cypress
        key: cypress-cache-${{ hashFiles('cypress.lock') }}
        restore-keys: |
          cypress-cache-

    - name: Restore node_modules Cache
      id: node-modules-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          node_modules
          api/node_modules
          api/cdk/node_modules
          api/src/functions/messagingService/reactEmail/node_modules
          content/node_modules
          packages/content-types/node_modules
          shared/node_modules
          web/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          node-modules-${{ runner.os }}-

    - name: Install Dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: yarn install --immutable

    - name: Save node_modules Cache
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          node_modules
          api/node_modules
          api/cdk/node_modules
          api/src/functions/messagingService/reactEmail/node_modules
          content/node_modules
          packages/content-types/node_modules
          shared/node_modules
          web/node_modules
        key: ${{ steps.node-modules-cache.outputs.cache-primary-key }}

    - name: Verify Cypress Installation
      shell: bash
      run: yarn cypress install

    - name: Build Application
      shell: bash
      run: yarn build
