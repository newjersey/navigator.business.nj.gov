name: "Perform Integration Tests"
description: "Starts API, Wiremock, Web, and executes Cypress integration tests."

inputs:
  suite:
    description: "The Cypress test suite group to run."
    required: true
  browser:
    description: "Browser to use for Cypress."
    required: true
  enable-dashboard:
    description: "Enable Cypress dashboard recording."
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure and Build
      uses: ./.github/actions/configure-and-build

    - name: Setup Local DynamoDB
      uses: ./.github/actions/setup-local-dynamodb

    - name: Setup Chrome
      if: inputs.browser == 'chrome'
      id: chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Start Services
      shell: bash
      run: |
        pnpm --filter @businessnjgovnavigator/api run start &
        pnpm --filter @businessnjgovnavigator/api run start:wiremock &
        pnpm --filter @businessnjgovnavigator/web run start &

    - name: Run Cypress Integration Tests
      shell: bash
      working-directory: web
      env:
        BROWSER: ${{ steps.chrome.outputs.chrome-path || inputs.browser }}
      run: |
        pnpm run cypress:run \
          --browser="$BROWSER" \
          --record=${{ inputs.enable-dashboard }} \
          --env SUITE=${{ inputs.suite }}

    - name: Upload Cypress Screenshots
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: cypress-screenshots-${{ inputs.suite }}
        path: web/cypress/screenshots/
        retention-days: 7

    - name: Upload Cypress Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cypress-results-${{ inputs.suite }}
        path: web/cypress/results/
        retention-days: 7
