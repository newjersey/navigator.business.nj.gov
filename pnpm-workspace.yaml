packages:
  - api
  - api/cdk
  - api/src/functions/messagingService/reactEmail
  - content
  - packages/content-types
  - packages/static-site
  - shared
  - web

nodeLinker: hoisted
sharedWorkspaceLockfile: true
includeWorkspaceRoot: false
pmOnFail: error
saveExact: true
verifyDepsBeforeRun: false
enablePrePostScripts: true
autoDedupe: false
autoInstallPeers: false
resolvePeersFromWorkspaceRoot: false
# The existing nc dependency includes a Git-hosted netcat dependency.
blockExoticSubdeps: false

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true
  leveldown: true
  unrs-resolver: true
  core-js-pure: false
  cypress: false
  puppeteer: false

skills:
  dirs: []

python:
  enabled: false
cargo:
  enabled: false

overrides:
  body-parser: 2.4.0
  "trim@0.0.1": 1.0.1
  postcss: 8.5.23
  glob-parent: 6.0.2
  tar: 7.5.22
  ansi-regex: 5.0.1
  trim-newlines: 5.0.0
  react-is: 19.2.8
  "nc>netcat": "git+https://github.com/dsueltenfuss/netcat.git#d24823a031f3da36d383945f5bfa354b41006fff"
  # Keep the previously locked static-site resolutions when importing Yarn's lockfile.
  "@uswds/uswds@3.13.0>sass-embedded-linux-x64:optional": 1.101.0
  "next-intl@4.13.4>icu-minify": 4.13.4
  "next-intl@4.13.4>next-intl-swc-plugin-extractor": 4.13.4
  "next-intl@4.13.4>use-intl": 4.13.4
  "cspell-lib@10.0.1>import-fresh": 4.0.0
  "cspell-config-lib@10.0.1>yaml": 2.9.0
  "lint-staged@17.2.0>yaml": 2.9.0

packageExtensions:
  "@aws-sdk/credential-provider-ini@*":
    peerDependenciesMeta:
      "@aws-sdk/client-sts":
        optional: true
  "@aws-sdk/credential-provider-web-identity@*":
    peerDependenciesMeta:
      "@aws-sdk/client-sts":
        optional: true
  "@aws-sdk/token-providers@*":
    peerDependenciesMeta:
      "@aws-sdk/client-sso-oidc":
        optional: true
  "@dnd-kit/core@*":
    peerDependenciesMeta:
      react-dom:
        optional: true
  "@react-email/preview-server@*":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@react-email/render@*":
    peerDependenciesMeta:
      react-dom:
        optional: true
  "@storybook/addon-controls@*":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@storybook/addon-designs@*":
    peerDependenciesMeta:
      "@storybook/manager-api":
        optional: true
      "@storybook/preview-api":
        optional: true
  "@storybook/blocks@*":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@storybook/manager-api@*":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@storybook/nextjs@*":
    peerDependenciesMeta:
      next:
        optional: true
  "@storybook/theming@*":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@testing-library/user-event@*":
    peerDependenciesMeta:
      "@testing-library/dom":
        optional: true
  apollo-cache-inmemory@*:
    peerDependenciesMeta:
      graphql:
        optional: true
  apollo-client@*:
    peerDependenciesMeta:
      graphql:
        optional: true
  apollo-link-http@*:
    peerDependenciesMeta:
      graphql:
        optional: true
  apollo-link@*:
    peerDependenciesMeta:
      graphql:
        optional: true
  decap-cms-app@*:
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  decap-cms-backend-git-gateway@*:
    peerDependenciesMeta:
      decap-cms-ui-auth:
        optional: true
  eslint-plugin-storybook@*:
    peerDependenciesMeta:
      typescript:
        optional: true
  focus-trap-react@*:
    peerDependenciesMeta:
      prop-types:
        optional: true
  react-redux@*:
    peerDependenciesMeta:
      redux:
        optional: true
  react-select@*:
    peerDependenciesMeta:
      react-dom:
        optional: true
  react-transition-group@*:
    peerDependenciesMeta:
      react-dom:
        optional: true
  react-window@*:
    peerDependenciesMeta:
      react-dom:
        optional: true
  remark-slate-transformer@*:
    peerDependenciesMeta:
      unified:
        optional: true
  slate-base64-serializer@*:
    peerDependenciesMeta:
      slate:
        optional: true
  slate-plain-serializer@*:
    peerDependenciesMeta:
      slate:
        optional: true
  slick-carousel@*:
    peerDependenciesMeta:
      jquery:
        optional: true
  ts-node@*:
    peerDependenciesMeta:
      "@types/node":
        optional: true
