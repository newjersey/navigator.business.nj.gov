version: 1
applications:
  - appRoot: packages/static-site
    frontend:
      phases:
        preBuild:
          commands:
            - export PNPM_HOME="$HOME/.local/share/pnpm"
            - export PATH="$PNPM_HOME/bin:$PATH"
            - export PNPM_VERSION="$(node -p
              'require("../../package.json").packageManager.split("@")[1].split("+")[0]')"
            - curl -fsSL https://get.pnpm.io/install.sh | PNPM_NO_MODIFY_PATH=1 SHELL=/bin/sh sh
            - pnpm --dir ../.. install --frozen-lockfile
            - pnpm --dir ../.. --filter @businessnjgovnavigator/content-types run build
            - pnpm --dir ../.. --filter @businessnjgovnavigator/content run build
        build:
          commands:
            - pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
