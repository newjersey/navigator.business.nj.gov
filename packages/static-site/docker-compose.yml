services:
  static-site:
    build:
      context: ../..
      dockerfile: packages/static-site/Dockerfile.dev
    container_name: static-site
    image: businessnjgovnavigator-static-site:dev
    command: pnpm dev --hostname 0.0.0.0 --port 3000
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_MULTILINGUAL_ENABLED: "true"
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    networks:
      - static_site_network
    tmpfs:
      - /tmp
    volumes:
      - ./app:/app/packages/static-site/app
      - ./components:/app/packages/static-site/components
      - ./domain:/app/packages/static-site/domain
      - ./messages:/app/packages/static-site/messages
      - ./public:/app/packages/static-site/public
      - ./scripts:/app/packages/static-site/scripts
      - ./next.config.ts:/app/packages/static-site/next.config.ts
      - ./proxy.ts:/app/packages/static-site/proxy.ts
      - ./proxyAuth.ts:/app/packages/static-site/proxyAuth.ts
      - ./tsconfig.json:/app/packages/static-site/tsconfig.json
      - ../../content:/app/content
      - static_site_next:/app/packages/static-site/.next

networks:
  static_site_network:
    name: static-site-network

volumes:
  static_site_next:
    name: static-site-next
